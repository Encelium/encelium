# Windows installer for Encelium (electron-builder). Build with: npm run dist -w @encelium/desktop
appId: app.encelium.desktop # also the Windows app id (taskbar icon, notifications); matches main.js
productName: Encelium
copyright: Copyright © 2026 The Encelium Authors

directories:
  output: release
  buildResources: build

# Only what the installed app needs: the built screen, the bundled main process, the icon.
# Everything else (the engine, the design system) is already inside those bundles.
files:
  - dist/**
  - out/**
  - build/icon.ico
  - build/icon.png
  - package.json
extraMetadata:
  main: out/main.js
asar: true
# The icon also as a plain file next to the app: Windows can't read it from inside app.asar,
# and the taskbar then falls back to Electron's icon.
extraResources:
  - from: build/icon.ico
    to: icon.ico
npmRebuild: false
# Reuse the Electron already in node_modules instead of downloading it again.
electronDist: ../../node_modules/electron/dist

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Encelium

nsis:
  # One click. Asks Windows for permission and installs for everyone (Program Files);
  # if that's refused, installs just for this user instead. See build/installer.nsh.
  oneClick: true
  perMachine: false
  include: build/installer.nsh
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Encelium
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Uninstalling keeps the person's chats and settings (and never touches their project folders).
  deleteAppDataOnUninstall: false
  artifactName: Encelium-Setup-${version}.exe

# Publishing (auto-update from GitHub Releases) comes with the GitHub step.
publish: null
